# Learner (/root/learner, learner-api.service on 127.0.0.1:3010) on dev.biztoolz.app.
# Installed copy: /etc/nginx/snippets/learner.conf, included from the
# dev.biztoolz.app 443 server block in /etc/nginx/sites-available/dev-biztoolz,
# just before its `location /`.
#
# Two surfaces, never mixed:
#
#   /learner/      the human web UI and the calls it makes, behind the same
#                  auth_request gate as /console (biztools dev access).
#                  The web build (`bun run build:web:proxied`) puts its assets
#                  under /learner/assets and calls /learner/rpc and
#                  /learner/api/auth; those three are stripped to the API's
#                  own /assets, /rpc and /api/auth here, because biztools owns
#                  those paths on this host.
#   /learner-api/  machine RPC only (x-api-key, no gate): /rpc and /api/health.
#                  Everything else under it is 404, so the unauthenticated
#                  REST hook route and Better Auth are never public.
#
# The gate's credential (a biztools session cookie, or a biztools x-api-key)
# must never reach the Learner: on the gated paths the upstream x-api-key is
# replaced by `x-learner-key`, which is empty unless the client sent one.

location = /learner {
    return 301 /learner/;
}
location ^~ /learner/rpc/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:3010/rpc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-api-key $http_x_learner_key;
    proxy_read_timeout 600s;
}
location ^~ /learner/api/auth/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:3010/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-api-key $http_x_learner_key;
}
location ^~ /learner/assets/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:3010/assets/;
    proxy_set_header Host $host;
    proxy_set_header x-api-key "";
}
# Client-side routes (/learner/osmosis, ...): the path is kept, and the API's
# SPA fallback answers with index.html.
location ^~ /learner/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-api-key "";
}

location ^~ /learner-api/rpc/ {
    proxy_pass http://127.0.0.1:3010/rpc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
}
location = /learner-api/api/health {
    proxy_pass http://127.0.0.1:3010/api/health;
    proxy_set_header Host $host;
}
location ^~ /learner-api/ {
    return 404;
}
