# Learner (/root/learner, learner-api.service on 127.0.0.1:3010) on dev.biztoolz.app.
# Installed copy: /etc/nginx/snippets/learner.conf, included from the
# dev.biztoolz.app 443 server block in /etc/nginx/sites-available/dev-biztoolz,
# just before its `location /`.
#
# Two surfaces, never mixed:
#
#   /learner/      the human web UI and the calls it makes, behind the same
#                  auth_request gate as /console (biztools dev access).
#                  The UI is the Vite DEV server (learner-web.service, :5180,
#                  base /learner/), so edits hot-reload in the browser; the
#                  HMR websocket rides the same location. The app calls
#                  /learner/rpc and /learner/api/auth, which are stripped to
#                  the API's own /rpc and /api/auth, because biztools owns
#                  those paths on this host.
#   /learner-api/  machine routes only (no gate): /rpc (x-api-key), /api/health
#                  and the Read.ai webhook (its URL token is the credential).
#                  Everything else under it is 404, so the unauthenticated
#                  REST hook route and Better Auth are never public.
#
# The gate IS the Learner's authentication for humans (operator decision
# 2026-10-22: piggyback on biztools auth until the Learner has its own
# sign-in). On the gated paths nginx sets x-api-key to a Learner key from the
# root-only /etc/nginx/learner-gate-key.conf, overwriting whatever the client
# sent, so the gate's own credential never reaches the Learner and everyone
# the gate admits acts as that key's owner.

location = /learner {
    return 301 /learner/;
}
location ^~ /learner/rpc/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:3010/rpc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/learner-gate-key.conf;
    proxy_read_timeout 600s;
}
location ^~ /learner/api/auth/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:3010/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/learner-gate-key.conf;
}
# Client-side routes (/learner/osmosis, ...): the path is kept, and the API's
# SPA fallback answers with index.html.
location ^~ /learner/ {
    auth_request /auth/verify/pikku;
    error_page 401 = @pikku_login_dev;
    proxy_pass http://127.0.0.1:5180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header x-api-key "";
    proxy_read_timeout 3600s;
}

location ^~ /learner-api/rpc/ {
    proxy_pass http://127.0.0.1:3010/rpc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
}
location = /learner-api/api/health {
    proxy_pass http://127.0.0.1:3010/api/health;
    proxy_set_header Host $host;
}
# Read.ai meeting deliveries (Settings > Integrations > Read AI webhook). Read.ai
# cannot pass the human gate; the path token is the credential, checked by the API,
# so the request line (which carries it) is never written to the access log.
location ^~ /learner-api/webhooks/readai/ {
    access_log off;
    proxy_pass http://127.0.0.1:3010/api/webhooks/readai/;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /learner-api/ {
    return 404;
}
