# Learner machine routes: the API surface learner-desktop, the CLI hook and the
# uploader use, with no human gate. Included in the server block that serves
# the install's public origin; proxies to the `learner_api` upstream
# (deploy/nginx/learner-upstream.conf, http level). Shipped as-is: `bun run gate`
# runs this exact file in a throwaway nginx, so what it proves is what deploys.
#
#   /learner-api/rpc/<name>   POST, x-api-key (a device or machine key)
#   /learner-api/api/health   GET, no auth: { ok, product, contract, ... }
#   /learner-api/webhooks/readai/<token>   the path token is the credential
#   anything else under /learner-api/   404, so REST routes and Better Auth stay private

location ^~ /learner-api/rpc/ {
    proxy_pass http://learner_api/rpc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
}
location = /learner-api/api/health {
    proxy_pass http://learner_api/api/health;
    proxy_set_header Host $host;
}
# Read.ai meeting deliveries (Settings > Integrations > Read AI webhook). Read.ai
# cannot pass the human gate; the path token is the credential, checked by the API,
# so the request line (which carries it) is never written to the access log.
location ^~ /learner-api/webhooks/readai/ {
    access_log off;
    proxy_pass http://learner_api/api/webhooks/readai/;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /learner-api/ {
    return 404;
}
